<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | ElectroMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background-color: #f8fafc; }
        .item-card:hover { border-color: #3b82f6; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-black text-blue-600">Electro<span class="text-gray-800">Mart</span></a>
            <a href="/" class="text-sm font-bold text-gray-500 hover:text-blue-600 flex items-center transition">
                <i class="fa-solid fa-arrow-left mr-2"></i> Continue Shopping
            </a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-12 flex-1">
        <div class="flex items-baseline space-x-4 mb-10">
            <h1 class="text-3xl font-black text-gray-900">Your Cart</h1>
            <span id="cart-count-badge" class="text-gray-400 font-bold">(0 Items)</span>
        </div>

        <div class="flex flex-col lg:flex-row gap-10">
            <!-- Left: Cart Items List -->
            <div class="lg:w-2/3 space-y-6" id="cart-items-wrapper">
                <!-- Items will be injected here by JS -->
                <div class="animate-pulse space-y-4">
                    <div class="h-32 bg-gray-200 rounded-3xl w-full"></div>
                    <div class="h-32 bg-gray-200 rounded-3xl w-full"></div>
                </div>
            </div>

            <!-- Right: Order Summary Section -->
            <div class="lg:w-1/3">
                <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-gray-100 sticky top-24">
                    <h3 class="text-xl font-black text-gray-800 mb-8 flex items-center">
                        <i class="fa-solid fa-receipt mr-3 text-blue-600"></i> Order Summary
                    </h3>
                    
                    <div class="space-y-4 mb-8">
                        <div class="flex justify-between text-gray-500 font-medium">
                            <span>Subtotal</span>
                            <span id="subtotal-amount">$0.00</span>
                        </div>
                        <div class="flex justify-between text-gray-500 font-medium">
                            <span>Shipping Cost</span>
                            <span class="text-green-600 font-bold uppercase text-xs">Free</span>
                        </div>
                        <div class="flex justify-between text-gray-500 font-medium">
                            <span>Estimated Tax</span>
                            <span>$0.00</span>
                        </div>
                        <hr class="border-gray-50">
                        <div class="flex justify-between items-center pt-2">
                            <span class="text-gray-900 font-black">Total Amount</span>
                            <span id="total-amount" class="text-3xl font-black text-blue-600">$0.00</span>
                        </div>
                    </div>

                    <button id="checkout-btn" onclick="window.location.href='/pages/checkout.html'" 
                        class="w-full bg-gray-900 text-white py-5 rounded-2xl font-black text-lg hover:bg-black transition-all shadow-xl shadow-gray-200 active:scale-95 disabled:bg-gray-200 disabled:cursor-not-allowed">
                        Proceed to Checkout
                    </button>

                    <div class="mt-6 flex items-center justify-center space-x-4 grayscale opacity-50">
                        <i class="fa-brands fa-cc-visa text-2xl"></i>
                        <i class="fa-brands fa-cc-mastercard text-2xl"></i>
                        <i class="fa-brands fa-cc-paypal text-2xl"></i>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-100 py-10 mt-12">
        <div class="container mx-auto px-4 text-center text-gray-400 text-sm font-bold">
            &copy; 2024 ElectroMart | Secured by 256-bit SSL
        </div>
    </footer>

    <!-- Scripts -->
    <script src="../js/cart.js"></script>
</body>
</html>
