<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ElectroMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; }
        .input-field { width: 100%; background-color: #f1f5f9; border: none; padding: 1rem; border-radius: 1rem; font-weight: bold; outline: none; transition: all 0.3s; }
        .input-field:focus { box-shadow: 0 0 0 2px #3b82f6; background-color: #fff; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Simple Header -->
    <header class="bg-white shadow-sm py-6 mb-10">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-black text-blue-600 tracking-tighter">ElectroMart</a>
            <div class="flex items-center text-gray-400 font-bold text-xs uppercase space-x-2">
                <i class="fa-solid fa-lock text-green-500"></i>
                <span>Secure Checkout</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 flex-1 pb-20">
        <div class="max-w-6xl mx-auto flex flex-col lg:flex-row gap-12">
            
            <!-- Left: Shipping & Payment -->
            <div class="lg:w-2/3">
                <div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-gray-100">
                    <h2 class="text-2xl font-black text-gray-800 mb-8 flex items-center">
                        <i class="fa-solid fa-map-location-dot mr-4 text-blue-600"></i> Shipping Details
                    </h2>
                    
                    <form id="checkout-form" class="space-y-6">
                        <div>
                            <label class="block text-[10px] font-black text-gray-400 uppercase mb-2 ml-2">Full Address</label>
                            <input type="text" id="address" required class="input-field" placeholder="House #, Road #, Area Name">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-[10px] font-black text-gray-400 uppercase mb-2 ml-2">City</label>
                                <input type="text" id="city" required class="input-field" placeholder="e.g. Dhaka">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-gray-400 uppercase mb-2 ml-2">Postal Code</label>
                                <input type="text" id="postalCode" required class="input-field" placeholder="1212">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[10px] font-black text-gray-400 uppercase mb-2 ml-2">Phone Number</label>
                            <input type="text" id="phone" required class="input-field" placeholder="+880 1XXXXXXXXX">
                        </div>

                        <div class="pt-8 border-t border-gray-50">
                            <h2 class="text-2xl font-black text-gray-800 mb-6 flex items-center">
                                <i class="fa-solid fa-credit-card mr-4 text-blue-600"></i> Payment Method
                            </h2>
                            <div class="p-5 border-2 border-blue-600 bg-blue-50 rounded-2xl flex items-center">
                                <i class="fa-solid fa-money-bill-1-wave text-blue-600 text-xl mr-4"></i>
                                <span class="font-black text-gray-800">Cash on Delivery (Standard)</span>
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-blue-600 text-white py-5 rounded-[2rem] font-black text-xl hover:bg-blue-700 transition shadow-xl shadow-blue-100 active:scale-95 mt-10">
                            Place Order
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right: Order Summary -->
            <div class="lg:w-1/3">
                <div class="bg-slate-900 text-white p-10 rounded-[2.5rem] shadow-2xl sticky top-10">
                    <h3 class="text-xl font-black mb-8 border-b border-slate-800 pb-4">In Your Bag</h3>
                    
                    <div id="checkout-items-list" class="space-y-6 mb-10 max-h-[300px] overflow-y-auto pr-2">
                        <!-- Items load here -->
                    </div>

                    <div class="space-y-4 border-t border-slate-800 pt-6">
                        <div class="flex justify-between text-slate-400 font-bold text-sm">
                            <span>Subtotal</span>
                            <span id="summary-subtotal" class="text-white">$0.00</span>
                        </div>
                        <div class="flex justify-between text-slate-400 font-bold text-sm">
                            <span>Shipping</span>
                            <span class="text-green-400 font-black">FREE</span>
                        </div>
                        <div class="flex justify-between items-center pt-4">
                            <span class="text-lg font-black uppercase tracking-tighter">Grand Total</span>
                            <span id="summary-total" class="text-3xl font-black text-blue-400">$0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/checkout.js"></script>
</body>
</html>
