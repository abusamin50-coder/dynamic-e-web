<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ElectroMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
        <div class="text-center mb-8">
            <a href="/" class="text-3xl font-bold text-blue-600">ElectroMart</a>
            <p class="text-gray-500 mt-2">Login to your account</p>
        </div>
        <form id="login-form" class="space-y-5">
            <input type="email" id="email" required class="w-full border p-3 rounded-xl outline-none focus:border-blue-500" placeholder="Email">
            <input type="password" id="password" required class="w-full border p-3 rounded-xl outline-none focus:border-blue-500" placeholder="Password">
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">Login</button>
        </form>
        <p class="mt-6 text-center text-sm">Don't have an account? <a href="/pages/register.html" class="text-blue-600 font-bold">Register</a></p>
    </div>
    <script src="../js/auth.js"></script>
</body>
</html>
