<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | ElectroMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            scroll-behavior: smooth;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .back-btn:hover i { transform: translateX(-5px); }
        .back-btn { color: #94a3b8; }
        .back-btn:hover { color: #f1f5f9; }
        .breadcrumb-link { color: #475569; }
        .breadcrumb-link:hover { color: #60a5fa; }
        .breadcrumb-current { color: #94a3b8; }
        .related-title { color: #f1f5f9; }
        
        #main-product-image { min-height: 300px; object-fit: contain; }

        /* Dropdown Menu Styles */
        .prod-action-menu {
            position: absolute;
            top: 50px;
            right: 12px;
            z-index: 30;
            background: white;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, .15);
            padding: 6px;
            min-width: 175px;
            display: none;
            flex-direction: column;
            gap: 2px;
        }
        .prod-action-menu.open { display: flex; }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50 py-4">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-black text-blue-600 tracking-tighter">ElectroMart</a>
            <div class="relative">
                <button id="profile-btn"
                    class="h-10 w-10 rounded-full bg-slate-100 flex items-center justify-center border-2 border-transparent hover:border-blue-600 transition-all">
                    <i class="fa-solid fa-user text-blue-600"></i>
                </button>
                <div id="profile-menu"
                    class="hidden absolute right-0 mt-3 w-64 bg-white rounded-2xl shadow-2xl border border-gray-100 py-3 z-50">
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 flex-1">

        <nav class="flex items-center text-xs font-bold uppercase tracking-widest mb-6">
            <a href="/" class="breadcrumb-link transition-colors">Home</a>
            <i class="fa-solid fa-chevron-right mx-3 text-[8px] text-slate-600"></i>
            <span id="breadcrumb-category" class="breadcrumb-link hover:text-blue-400 cursor-pointer transition-colors">Category</span>
            <i class="fa-solid fa-chevron-right mx-3 text-[8px] text-slate-600"></i>
            <span id="breadcrumb-name" class="breadcrumb-current">Product</span>
        </nav>

        <button onclick="window.location.href='/'" class="back-btn flex items-center font-bold mb-8 transition group text-sm">
            <i class="fa-solid fa-arrow-left mr-2 transition-transform"></i> Back to Shop
        </button>

        <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden flex flex-col md:flex-row mb-20">
            <div class="md:w-1/2 p-6 md:p-10 flex items-center justify-center bg-white border-r border-slate-50">
                <img id="main-product-image" src="https://via.placeholder.com/600x600?text=Loading..."
                    class="max-w-full h-auto rounded-3xl transition-transform duration-700 hover:scale-105" alt="Product Image">
            </div>

            <div class="md:w-1/2 p-8 md:p-16 flex flex-col justify-center">
                <span id="product-brand" class="bg-blue-50 text-blue-600 text-[10px] font-black uppercase px-4 py-1.5 rounded-full w-fit tracking-widest mb-6 border border-blue-100">Brand</span>
                <h1 id="product-name" class="text-3xl md:text-5xl font-black text-slate-900 leading-tight mb-4 tracking-tighter">Loading...</h1>
                <div class="flex items-baseline space-x-3 mb-8">
                    <p id="product-price" class="text-5xl font-black text-blue-600">$0.00</p>
                </div>

                <div class="bg-slate-50 p-6 rounded-3xl mb-8 border border-slate-100">
                    <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Description</h4>
                    <p id="product-description" class="text-slate-600 leading-relaxed text-sm font-medium">Loading...</p>
                </div>

                <div id="stock-status-container" class="mb-10 text-sm font-black uppercase tracking-tighter"></div>

                <div class="flex flex-col sm:flex-row gap-4">
                    <button id="add-to-cart-btn" class="flex-1 bg-blue-600 text-white py-5 rounded-[1.5rem] font-black hover:bg-blue-700 transition shadow-xl shadow-blue-100 flex items-center justify-center active:scale-95">
                        <i class="fa-solid fa-cart-plus mr-3 text-xl"></i> Add to Cart
                    </button>
                    <button id="buy-now-btn" class="flex-1 bg-slate-900 text-white py-5 rounded-[1.5rem] font-black hover:bg-black transition shadow-xl active:scale-95">
                        Buy Now
                    </button>
                </div>
            </div>
        </div>

        <section id="related-section" class="hidden">
            <h2 class="related-title text-2xl font-black mb-10 flex items-center">
                <span class="w-2 h-8 bg-blue-600 mr-4 rounded-full"></span> Similar Products
            </h2>
            <div id="related-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8"></div>
        </section>
    </main>

    <!-- AUTH MODAL -->
    <div id="auth-modal" class="fixed inset-0 bg-black/60 z-[200] hidden items-center justify-center px-4" style="backdrop-filter:blur(8px)">
        <div class="bg-white p-8 text-center shadow-2xl rounded-[24px] max-w-[380px] w-full">
            <div class="w-16 h-16 bg-blue-50 rounded-2xl flex items-center justify-center mx-auto mb-5"><i class="fa-solid fa-lock text-2xl text-blue-600"></i></div>
            <h3 style="font-weight:800; font-size:22px; margin-bottom:8px">Login Required</h3>
            <p class="text-slate-500 text-sm mb-7" id="modal-action-name">Please login to continue.</p>
            <div class="flex flex-col gap-3">
                <a href="/pages/login.html" class="bg-blue-600 text-white py-3.5 rounded-xl font-bold text-sm text-center">Login Now</a>
                <button onclick="window.closeAuthModal()" class="text-slate-500 font-semibold text-sm">Maybe Later</button>
            </div>
        </div>
    </div>

    <script>
        /* Global Functions */
        window.checkAuth = (actionName) => {
            let user = null;
            try { user = JSON.parse(localStorage.getItem('userInfo')); } catch (e) { }
            if (user && user.token) return true;
            const modal = document.getElementById('auth-modal');
            const msg = document.getElementById('modal-action-name');
            if (msg) msg.textContent = `Please login to ${actionName}.`;
            if (modal) { modal.classList.remove('hidden'); modal.classList.add('flex'); }
            return false;
        };

        window.closeAuthModal = () => {
            const m = document.getElementById('auth-modal');
            if (m) { m.classList.add('hidden'); m.classList.remove('flex'); }
        };

        document.getElementById('auth-modal')?.addEventListener('click', function (e) {
            if (e.target === this) window.closeAuthModal();
        });

        /* Dropdown Logic */
        function toggleProdMenu(id) {
            document.querySelectorAll('.prod-action-menu.open').forEach(m => { if (m.id !== id) m.classList.remove('open'); });
            document.getElementById(id)?.classList.toggle('open');
        }
        document.addEventListener('click', (e) => {
            if(!e.target.closest('.prod-action-btn')) {
                document.querySelectorAll('.prod-action-menu.open').forEach(m => m.classList.remove('open'));
            }
        });

        // Initialize Buttons after page load
        document.addEventListener('DOMContentLoaded', () => {
            const productId = new URLSearchParams(window.location.search).get('id');
            
            document.getElementById('add-to-cart-btn')?.addEventListener('click', () => {
                window.globalAddToCart(productId, false);
            });

            document.getElementById('buy-now-btn')?.addEventListener('click', () => {
                window.globalBuyNow(productId, false);
            });
        });
    </script>

    <!-- Scripts -->
    <script src="../js/cart-handler.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/details.js"></script>
</body>

</html>
