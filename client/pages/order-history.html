<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | ElectroMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">

    <header class="bg-white shadow-sm py-4 mb-10">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-black text-blue-600 tracking-tighter">ElectroMart</a>
            <a href="/" class="text-gray-500 font-bold text-sm hover:text-blue-600"><i class="fa-solid fa-house mr-2"></i>Back to Home</a>
        </div>
    </header>

    <main class="container mx-auto px-4 pb-20">
        <div class="max-w-5xl mx-auto">
            <h1 class="text-3xl font-black text-gray-800 mb-10">Order History</h1>

            <div id="orders-list" class="space-y-6">
                <!-- Orders will be injected here -->
                <div class="p-10 text-center text-gray-400">Loading your orders...</div>
            </div>
        </div>
    </main>

    <script src="../js/orders.js"></script>
</body>
</html>
