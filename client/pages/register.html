<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ElectroMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center px-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
        <div class="text-center mb-8">
            <a href="/" class="text-3xl font-bold text-blue-600">Electro<span class="text-gray-800">Mart</span></a>
            <p class="text-gray-500 mt-2">Create your account to start shopping</p>
        </div>

        <form id="register-form" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                <input type="text" id="name" required class="w-full border border-gray-300 px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500" placeholder="John Doe">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" required class="w-full border border-gray-300 px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500" placeholder="example@mail.com">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" id="password" required class="w-full border border-gray-300 px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500" placeholder="••••••••">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg">Create Account</button>
        </form>

        <p class="text-center text-gray-600 mt-6 text-sm">
            Already have an account? <a href="login.html" class="text-blue-600 font-bold hover:underline">Login</a>
        </p>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
