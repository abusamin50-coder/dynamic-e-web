<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex">
    <aside class="w-64 bg-slate-900 text-white min-h-screen fixed shadow-2xl">
        <div class="p-6 font-black text-2xl text-blue-500">ElectroMart</div>
        <nav class="p-4 space-y-2">
            <a href="dashboard.html" class="block p-3 hover:bg-slate-800 rounded-xl">Dashboard</a>
            <a href="products.html" class="block p-3 hover:bg-slate-800 rounded-xl">Products</a>
            <a href="categories.html" class="block p-3 bg-blue-600 rounded-xl">Categories</a>
        </nav>
    </aside>
    <main class="flex-1 ml-64 p-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-black">Categories</h1>
            <a href="add-category.html" class="bg-blue-600 text-white px-6 py-2 rounded-xl font-bold">Add Category</a>
        </div>
        <div class="bg-white rounded-[2rem] shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 text-gray-400 uppercase text-[10px] font-black">
                    <tr><th class="p-6">Name</th><th class="p-6">Description</th><th class="p-6">Actions</th></tr>
                </thead>
                <tbody id="category-table-body"></tbody>
            </table>
        </div>
    </main>
    <script src="../../js/admin.js"></script>
</body>
</html>
