<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex font-sans">
    <aside class="w-64 bg-slate-900 text-white min-h-screen flex flex-col fixed shadow-2xl z-50">
        <div class="p-6"><a href="/" class="text-2xl font-black text-blue-500">ElectroMart</a></div>
        <nav class="flex-1 px-4 space-y-2 mt-4">
            <a href="dashboard.html" class="flex items-center space-x-3 p-3 hover:bg-slate-800 rounded-xl text-slate-300">
                <i class="fa-solid fa-gauge"></i><span>Dashboard</span>
            </a>
            <a href="products.html" class="flex items-center space-x-3 bg-blue-600 p-3 rounded-xl transition text-white">
                <i class="fa-solid fa-box"></i><span>Products</span>
            </a>
            <a href="categories.html" class="flex items-center space-x-3 p-3 hover:bg-slate-800 rounded-xl text-slate-300">
                <i class="fa-solid fa-list"></i><span>Categories</span>
            </a>
        </nav>
    </aside>
    <main class="flex-1 ml-64 p-8">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black text-slate-800">Published Products</h1>
            <a href="add-product.html" class="bg-blue-600 text-white px-8 py-3 rounded-2xl font-bold shadow-lg">Add New Product</a>
        </div>
        <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-slate-50 text-slate-400 uppercase text-[10px] font-bold">
                    <tr><th class="p-6">Product</th><th class="p-6">Category</th><th class="p-6">Price</th><th class="p-6">Stock</th><th class="p-6 text-center">Actions</th></tr>
                </thead>
                <tbody id="product-table-body" class="divide-y divide-slate-50"></tbody>
            </table>
        </div>
    </main>
    <script src="../../js/admin.js"></script>
</body>
</html>
