<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Edit Category</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 p-10">
    <div class="max-w-xl mx-auto bg-white p-10 rounded-[2rem] shadow-xl">
        <h1 class="text-2xl font-black mb-6">Edit Category</h1>
        <form id="edit-category-form" class="space-y-4">
            <input type="text" name="name" required class="w-full border p-4 rounded-2xl outline-none" placeholder="Name">
            <textarea name="description" required class="w-full border p-4 rounded-2xl outline-none h-32" placeholder="Description"></textarea>
            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black">Update Category</button>
            <a href="categories.html" class="block text-center mt-4 text-gray-400 font-bold">Cancel</a>
        </form>
    </div>
    <script src="../../js/admin.js"></script>
</body>
</html>
