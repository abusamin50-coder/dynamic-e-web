<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Category | Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-xl mx-auto">
        <!-- Back Button -->
        <a href="categories.html" class="inline-flex items-center text-blue-600 font-bold mb-6 hover:underline">
            <i class="fa-solid fa-arrow-left mr-2"></i> Back to Categories
        </a>

        <div class="bg-white p-8 rounded-xl shadow-lg">
            <h1 class="text-2xl font-bold mb-6 text-gray-800">Add New Category</h1>
            <form id="add-category-form" class="space-y-4">
                <div>
                    <label class="block font-bold mb-1">Category Name</label>
                    <input type="text" name="name" placeholder="e.g. Smartphones" required 
                        class="w-full border p-3 rounded-lg outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block font-bold mb-1">Description</label>
                    <textarea name="description" placeholder="Short description..." required 
                        class="w-full border p-3 rounded-lg outline-none h-32 focus:border-blue-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">
                    Save Category
                </button>
            </form>
        </div>
    </div>
    <script src="../../js/admin.js"></script>
</body>
</html>
