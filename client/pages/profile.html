<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | ElectroMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm py-4 sticky top-0 z-50">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-black text-blue-600 tracking-tighter">ElectroMart</a>
            <a href="/" class="text-sm font-bold text-slate-500 hover:text-blue-600 flex items-center transition">
                <i class="fa-solid fa-arrow-left mr-2"></i> Back to Shop
            </a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-12 flex-1">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row gap-10">
            <!-- Sidebar -->
            <div class="md:w-1/3">
                <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 text-center mb-6">
                    <div id="avatar-circle" class="h-24 w-24 bg-blue-600 text-white rounded-full flex items-center justify-center text-4xl font-black mx-auto mb-4 shadow-xl shadow-blue-100">?</div>
                    <h2 id="display-name" class="text-xl font-black text-slate-800">Loading...</h2>
                    <p id="display-email" class="text-sm text-slate-400 font-medium">Please wait...</p>
                </div>
                <div class="bg-slate-900 p-6 rounded-[2rem] shadow-xl text-white">
                    <nav class="space-y-2">
                        <a href="order-history.html" class="flex items-center p-4 hover:bg-slate-800 rounded-2xl transition font-bold"><i class="fa-solid fa-box-open mr-4 text-blue-400"></i> My Orders</a>
                        <a href="cart.html" class="flex items-center p-4 hover:bg-slate-800 rounded-2xl transition font-bold"><i class="fa-solid fa-cart-shopping mr-4 text-green-400"></i> My Cart</a>
                    </nav>
                </div>
            </div>

            <!-- Forms -->
            <div class="md:w-2/3 space-y-8">
                <div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-slate-100">
                    <h3 class="text-2xl font-black text-slate-800 mb-8 flex items-center"><i class="fa-solid fa-user-pen mr-4 text-blue-600"></i> Account Information</h3>
                    <form id="profile-update-form" class="space-y-6">
                        <div>
                            <label class="block text-[10px] font-black uppercase text-slate-400 mb-2 ml-2">Full Name</label>
                            <input type="text" id="input-name" required class="w-full bg-slate-50 border-none p-4 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none font-bold text-slate-700">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase text-slate-400 mb-2 ml-2">Email Address</label>
                            <input type="email" id="input-email" disabled class="w-full bg-slate-100 border-none p-4 rounded-2xl text-slate-400 font-bold cursor-not-allowed">
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black hover:bg-blue-700 transition shadow-lg shadow-blue-100">Save Changes</button>
                    </form>
                </div>

                <div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-slate-100">
                    <h3 class="text-2xl font-black text-slate-800 mb-8 flex items-center"><i class="fa-solid fa-shield-halved mr-4 text-red-600"></i> Security</h3>
                    <form id="password-update-form" class="space-y-6">
                        <input type="password" id="input-password" placeholder="New Password" required class="w-full bg-slate-50 border-none p-4 rounded-2xl focus:ring-2 focus:ring-red-500 outline-none font-bold">
                        <input type="password" id="input-confirm-password" placeholder="Confirm Password" required class="w-full bg-slate-50 border-none p-4 rounded-2xl focus:ring-2 focus:ring-red-500 outline-none font-bold">
                        <button type="submit" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black hover:bg-black transition shadow-lg">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- CRITICAL: LOAD SCRIPTS IN THIS EXACT ORDER -->
    <script src="../js/cart-handler.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
